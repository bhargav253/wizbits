services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wizbits
      POSTGRES_USER: wizbits
      POSTGRES_PASSWORD: wizbits-local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - wizbits-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wizbits -d wizbits"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  wizbits-postgres:
